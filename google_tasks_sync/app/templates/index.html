<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Tasks JSON Sync | Home Assistant</title>
  <link rel="stylesheet" href="{{ root_path }}/static/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body data-root-path="{{ root_path }}">
  
  <div class="app-container">
    <!-- Top Header Bar -->
    <header class="navbar">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <div class="brand-text">
          <h1>Google Tasks JSON Editor & Sync</h1>
          <span class="badge" id="sync-status-badge">Klaar</span>
        </div>
      </div>
      
      <div class="nav-actions">
        <button id="btn-sync-now" class="btn btn-primary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Google Tasks Syncen
        </button>
      </div>
    </header>

    <!-- Main Content Area: Editor + Debug Log -->
    <main class="content-area">
      
      <!-- Top Section: JSON Editor Panel -->
      <div class="editor-panel">
        <div class="editor-toolbar">
          <div class="toolbar-left">
            <span class="editor-title">Taken & Lijsten (JSON)</span>
            <span class="tag" id="json-stats-tag">Laden...</span>
          </div>
          
          <div class="toolbar-actions">
            <button class="btn btn-outline" id="btn-copy-json" title="Kopieer JSON naar klembord">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              Kopieer JSON
            </button>
            <button class="btn btn-outline" id="btn-paste-json" title="Plak JSON vanaf klembord">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
              Plak JSON
            </button>
            <button class="btn btn-outline" id="btn-reload-json" title="Herlaad vanuit Google Tasks">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
              Herlaad
            </button>
            <button class="btn btn-success" id="btn-apply-json" title="Pas gewijzigde JSON live toe op Google Tasks">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
              Toepassen naar Google Tasks
            </button>
          </div>
        </div>

        <div class="editor-container">
          <textarea id="json-textarea" spellcheck="false" placeholder="Laden van taken JSON..."></textarea>
        </div>
        
        <div class="editor-footer">
          <div id="json-status-msg" class="status-msg">Gereed: Bewerk, kopieer of plak JSON en klik op Toepassen.</div>
        </div>
      </div>

      <!-- Bottom Section: Complete Debug & Sync Log Panel -->
      <div class="debug-panel">
        <div class="debug-header">
          <div class="debug-title">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
            <span>Live Debug & Synchronisatie Log</span>
          </div>
          <div class="debug-actions">
            <span class="debug-auto-tag" id="debug-last-sync">Laatste sync: -</span>
            <button class="btn btn-sm btn-outline" id="btn-clear-logs">Logs Wissen</button>
            <button class="btn btn-sm btn-outline" id="btn-refresh-logs">Verversen</button>
          </div>
        </div>
        <div class="terminal-log" id="logs-container">
          <div class="log-entry">[SYSTEM] Debug logboek geïnitialiseerd...</div>
        </div>
      </div>

    </main>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="{{ root_path }}/static/js/app.js"></script>
</body>
</html>
