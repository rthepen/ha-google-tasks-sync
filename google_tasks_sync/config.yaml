name: "Google Tasks Multi-Account Sync"
description: "Automatically sync Google Tasks across multiple Google accounts with a live JSON editor, Taken Beheerder with Sub-lists and Dropdown Reassignment, Kapitein Verdeler and Ingress Web UI"
version: "1.1.5"
slug: "google_tasks_sync"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:checkbox-marked-circle-auto-outline"
panel_title: "Google Tasks"
options:
  sync_interval_minutes: 15
  auto_sync_enabled: true
schema:
  sync_interval_minutes: int(1,1440)
  auto_sync_enabled: bool
